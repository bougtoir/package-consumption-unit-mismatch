[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pcum"
version = "0.1.0"
description = "Package-consumption unit mismatch simulation and portfolio optimization"
requires-python = ">=3.10"
dependencies = [
  "matplotlib==3.10.6",
  "numpy==2.2.6",
  "pandas==2.3.2",
  "Pillow==11.3.0",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "PyYAML==6.0.2",
  "scipy==1.15.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.13.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
